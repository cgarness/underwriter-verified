name: A2P production post-release verification

on:
  push:
    branches:
      - codex/cg-financial-a2p-refinements-20261005

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify live production routes
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "@playwright/test";

          const origin = "https://www.underwriterverified.com";
          const routes = [
            "/cg-financial/christopher-garness",
            "/sms-opt-in",
            "/cg-financial/christopher-garness/privacy-policy",
            "/cg-financial/christopher-garness/terms-and-conditions",
            "/cg-financial/christopher-garness/bookcall",
          ];
          const viewports = [
            { name: "desktop", width: 1440, height: 900 },
            { name: "mobile", width: 390, height: 844 },
          ];
          const nonSharing =
            "We do not sell, rent, or share mobile numbers, mobile information, SMS opt-in data, or SMS consent with third parties or affiliates for marketing or promotional purposes.";

          const browser = await chromium.launch({ headless: true });
          try {
            const readinessContext = await browser.newContext({ viewport: viewports[0] });
            const readinessPage = await readinessContext.newPage();
            let live = false;
            for (let attempt = 1; attempt <= 36; attempt++) {
              await readinessPage.goto(origin + "/cg-financial/christopher-garness/privacy-policy", { waitUntil: "networkidle" });
              const body = await readinessPage.locator("body").innerText();
              if (body.includes("October 5, 2026") && body.includes(nonSharing)) {
                live = true;
                break;
              }
              await readinessPage.waitForTimeout(5000);
            }
            await readinessContext.close();
            if (!live) throw new Error("October 5 production copy did not become live during verification window");

            for (const viewport of viewports) {
              const context = await browser.newContext({ viewport });
              const page = await context.newPage();

              for (const route of routes) {
                const response = await page.goto(origin + route, { waitUntil: "networkidle" });
                if (!response || !response.ok()) throw new Error(`${viewport.name} ${route}: HTTP ${response?.status()}`);
                const body = await page.locator("body").innerText();
                if (/Agent Not Found|Opt-in page unavailable/i.test(body)) {
                  throw new Error(`${viewport.name} ${route}: expected public profile did not load`);
                }
                const overflow = await page.evaluate(() => document.documentElement.scrollWidth - window.innerWidth);
                if (overflow > 2) throw new Error(`${viewport.name} ${route}: horizontal overflow ${overflow}px`);
              }

              await page.goto(origin + "/sms-opt-in", { waitUntil: "networkidle" });
              const boxes = page.getByRole("checkbox");
              if (await boxes.count() !== 2) throw new Error(`${viewport.name}: expected two SMS checkboxes on /sms-opt-in`);
              for (let i = 0; i < 2; i++) if (await boxes.nth(i).isChecked()) throw new Error(`${viewport.name}: sms-opt-in checkbox ${i} preselected`);
              const privacyHref = await page.getByRole("link", { name: "Privacy Policy" }).last().getAttribute("href");
              const termsHref = await page.getByRole("link", { name: "Terms and Conditions" }).last().getAttribute("href");
              if (privacyHref !== "/cg-financial/christopher-garness/privacy-policy") throw new Error(`${viewport.name}: wrong live privacy footer link ${privacyHref}`);
              if (termsHref !== "/cg-financial/christopher-garness/terms-and-conditions") throw new Error(`${viewport.name}: wrong live terms footer link ${termsHref}`);
              const smsBody = await page.locator("body").innerText();
              for (const required of ["Christopher Garness", "CG Financial", "Message frequency varies", "Message and data rates may apply", "STOP", "HELP", "Carriers are not liable"]) {
                if (!smsBody.includes(required)) throw new Error(`${viewport.name}: sms-opt-in missing ${required}`);
              }

              await page.goto(origin + "/cg-financial/christopher-garness/privacy-policy", { waitUntil: "networkidle" });
              const privacyBody = await page.locator("body").innerText();
              if (!privacyBody.includes(nonSharing)) throw new Error(`${viewport.name}: privacy policy missing non-sharing statement`);
              if (!privacyBody.includes("October 5, 2026")) throw new Error(`${viewport.name}: privacy policy missing October 5 date`);
              if (!privacyBody.replace(/\D/g, "").includes("9097756963")) throw new Error(`${viewport.name}: privacy policy missing support phone`);
              if (!privacyBody.includes("chris@fflagent.com")) throw new Error(`${viewport.name}: privacy policy missing support email`);

              await page.goto(origin + "/cg-financial/christopher-garness/terms-and-conditions", { waitUntil: "networkidle" });
              const termsBody = await page.locator("body").innerText();
              if (!termsBody.includes("A call request by itself asks us to contact you about scheduling a call.")) throw new Error(`${viewport.name}: Terms section 4 clarification missing`);
              if (!termsBody.includes("If you separately select one of the optional SMS checkboxes described in Section 3")) throw new Error(`${viewport.name}: separate checkbox permission clarification missing`);

              await page.goto(origin + "/cg-financial/christopher-garness/bookcall", { waitUntil: "networkidle" });
              const callBoxes = page.getByRole("checkbox");
              if (await callBoxes.count() !== 2) throw new Error(`${viewport.name}: bookcall expected two SMS checkboxes`);
              for (let i = 0; i < 2; i++) if (await callBoxes.nth(i).isChecked()) throw new Error(`${viewport.name}: bookcall checkbox ${i} preselected`);

              console.log(`live routes OK: ${viewport.name}`);
              await context.close();
            }
          } finally {
            await browser.close();
          }
          NODE
