name: Agent client reviews checks
on:
  pull_request:
    paths:
      - "src/**"
      - "supabase/functions/submit-agent-review/**"
      - "supabase/migrations/*agent_client_reviews*"
      - ".github/workflows/agent-reviews.yml"
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_synthetic_test_only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.16.0"
      - run: npm ci
      - run: npx tsc --noEmit && npx tsc --noEmit -p tsconfig.app.json && npx tsc --noEmit -p tsconfig.node.json
      - run: npx eslint src/components/AgentReviewSummary.tsx src/components/AgentReviewsSection.tsx src/components/AgentReviewsAdminPanel.tsx src/hooks/useAgentReviews.ts src/lib/agentReviews.ts src/test/agentReviews.test.tsx supabase/functions/submit-agent-review/index.ts
      - run: npm test
      - run: npm run build
      - name: Verify review migration and RLS in disposable PostgreSQL 17
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/agent_reviews_security.sql
