name: A2P refinement temporary checks

on:
  push:
    branches:
      - codex/cg-financial-a2p-refinements-20261005

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Bun 1.3.10
        run: npm install --global bun@1.3.10
      - name: Verify Bun
        run: bun --version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript default
        run: npx tsc --noEmit
      - name: TypeScript app
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: A2P and intake tests
        run: npx vitest run src/test/a2p-compliance.test.tsx src/test/public-intake.test.tsx src/test/intake-environment.test.ts src/test/sms-eligibility.test.ts
      - name: Full tests
        run: npx vitest run
      - name: Changed-file lint
        run: |
          npx eslint             src/lib/a2pBrand.ts             src/components/LegalNavLinks.tsx             src/pages/SmsOptIn.tsx             src/pages/PrivacyPolicy.tsx             src/pages/TermsAndConditions.tsx             src/lib/smsDisclosure.ts             src/test/a2p-compliance.test.tsx             src/test/public-intake.test.tsx             src/test/sms-eligibility.test.ts             scripts/integration-api-checks.mjs
      - name: Diff whitespace check
        run: git diff --check origin/main...HEAD
      - name: Start local PostgreSQL
        run: |
          sudo chmod -R a+rX "$GITHUB_WORKSPACE"
          sudo systemctl start postgresql
      - name: Release-order SQL harness
        run: bash scripts/test-intake-sql.sh --release-order
      - name: Production build
        env:
          VERCEL_ENV: production
        run: npm run build
      - name: Install Chromium for rendered-route verification
        run: npx playwright install --with-deps chromium
      - name: Verify five rendered routes on desktop and mobile
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/uv-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT

          for i in {1..50}; do
            if curl -fsS http://127.0.0.1:4173/cg-financial/christopher-garness >/dev/null; then
              break
            fi
            sleep 0.2
          done

          node --input-type=module <<'NODE'
          import { chromium } from "@playwright/test";

          const base = "http://127.0.0.1:4173";
          const routes = [
            "/cg-financial/christopher-garness",
            "/sms-opt-in",
            "/cg-financial/christopher-garness/privacy-policy",
            "/cg-financial/christopher-garness/terms-and-conditions",
            "/cg-financial/christopher-garness/bookcall",
          ];
          const viewports = [
            { name: "desktop", width: 1440, height: 900 },
            { name: "mobile", width: 390, height: 844 },
          ];
          const nonSharing =
            "We do not sell, rent, or share mobile numbers, mobile information, SMS opt-in data, or SMS consent with third parties or affiliates for marketing or promotional purposes.";

          const browser = await chromium.launch({ headless: true });
          try {
            for (const viewport of viewports) {
              const context = await browser.newContext({ viewport });
              const page = await context.newPage();

              for (const route of routes) {
                await page.goto(base + route, { waitUntil: "networkidle" });
                const body = await page.locator("body").innerText();
                if (/Agent Not Found|Opt-in page unavailable/i.test(body)) {
                  throw new Error(`${viewport.name} ${route}: route did not load the expected public profile`);
                }
                const overflow = await page.evaluate(() => document.documentElement.scrollWidth - window.innerWidth);
                if (overflow > 2) {
                  throw new Error(`${viewport.name} ${route}: horizontal overflow ${overflow}px`);
                }
              }

              await page.goto(base + "/sms-opt-in", { waitUntil: "networkidle" });
              const boxes = page.getByRole("checkbox");
              if (await boxes.count() !== 2) throw new Error(`${viewport.name}: expected two SMS checkboxes`);
              for (let i = 0; i < 2; i++) {
                if (await boxes.nth(i).isChecked()) throw new Error(`${viewport.name}: SMS checkbox ${i} was preselected`);
              }
              const privacyHref = await page.getByRole("link", { name: "Privacy Policy" }).last().getAttribute("href");
              const termsHref = await page.getByRole("link", { name: "Terms and Conditions" }).last().getAttribute("href");
              if (privacyHref !== "/cg-financial/christopher-garness/privacy-policy") {
                throw new Error(`${viewport.name}: wrong sms-opt-in privacy footer link ${privacyHref}`);
              }
              if (termsHref !== "/cg-financial/christopher-garness/terms-and-conditions") {
                throw new Error(`${viewport.name}: wrong sms-opt-in terms footer link ${termsHref}`);
              }
              const smsBody = await page.locator("body").innerText();
              for (const required of ["Christopher Garness", "CG Financial", "Message frequency varies", "Message and data rates may apply", "STOP", "HELP", "Carriers are not liable"]) {
                if (!smsBody.includes(required)) throw new Error(`${viewport.name}: sms-opt-in missing ${required}`);
              }

              await page.goto(base + "/cg-financial/christopher-garness/privacy-policy", { waitUntil: "networkidle" });
              const privacyBody = await page.locator("body").innerText();
              if (!privacyBody.includes(nonSharing)) throw new Error(`${viewport.name}: privacy policy missing explicit non-sharing statement`);
              for (const required of ["909-775-6963", "chris@fflagent.com", "October 5, 2026"]) {
                if (!privacyBody.includes(required)) throw new Error(`${viewport.name}: privacy policy missing ${required}`);
              }

              await page.goto(base + "/cg-financial/christopher-garness/terms-and-conditions", { waitUntil: "networkidle" });
              const termsBody = await page.locator("body").innerText();
              if (!termsBody.includes("A call request by itself asks us to contact you about scheduling a call.")) {
                throw new Error(`${viewport.name}: terms section 4 call-request clarification missing`);
              }
              if (!termsBody.includes("If you separately select one of the optional SMS checkboxes described in Section 3")) {
                throw new Error(`${viewport.name}: terms section 4 checkbox permission preservation missing`);
              }

              await page.goto(base + "/cg-financial/christopher-garness/bookcall", { waitUntil: "networkidle" });
              const callBoxes = page.getByRole("checkbox");
              if (await callBoxes.count() !== 2) throw new Error(`${viewport.name}: bookcall expected two SMS checkboxes`);
              for (let i = 0; i < 2; i++) {
                if (await callBoxes.nth(i).isChecked()) throw new Error(`${viewport.name}: bookcall SMS checkbox ${i} was preselected`);
              }

              console.log(`rendered routes OK: ${viewport.name}`);
              await context.close();
            }
          } finally {
            await browser.close();
          }
          NODE
