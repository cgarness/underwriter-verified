name: A2P refinement temporary checks

on:
  push:
    branches:
      - codex/cg-financial-a2p-refinements-20261005

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun 1.3.10
        run: npm install --global bun@1.3.10
      - name: Verify Bun
        run: bun --version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript default
        run: npx tsc --noEmit
      - name: TypeScript app
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: A2P and intake tests
        run: npx vitest run src/test/a2p-compliance.test.tsx src/test/public-intake.test.tsx src/test/intake-environment.test.ts
      - name: Full tests
        run: npx vitest run
      - name: Production build
        env:
          VERCEL_ENV: production
        run: npm run build
      - name: Discover Supabase migration command
        run: npx --yes supabase@2.81.3 migration --help
      - name: Generate migration filename
        run: |
          npx --yes supabase@2.81.3 migration new advance_a2p_policy_disclosure
          find supabase/migrations -maxdepth 1 -type f -name '*_advance_a2p_policy_disclosure.sql' -print
